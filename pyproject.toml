[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recessionpop"
version = "0.2.0"
description = "Does popular music carry information about future consumer sentiment?"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]
